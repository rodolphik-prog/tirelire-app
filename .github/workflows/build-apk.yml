name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profil:
        description: "preview = APK pour ton téléphone · production = AAB pour le Play Store"
        type: choice
        options:
          - preview
          - production
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile ${{ inputs.profil }} --non-interactive
